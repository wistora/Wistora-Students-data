{% extends 'base.html' %}
{% block title %}Register | Student Portal{% endblock %}
{% block content %}<div class="panel"><h1>Create student account</h1><form method="post">{% csrf_token %}<label for="username">Username</label><input id="username" name="username" required><label for="email">Email</label><input id="email" name="email" type="email" required><label for="phone_number">Phone number</label><input id="phone_number" name="phone_number" type="tel" required><label for="college_name">College name</label><input id="college_name" name="college_name"><label for="password">Password</label><input id="password" name="password" type="password" required><button type="submit">Register</button></form><p class="muted">Already registered? <a href="{% url 'login' %}">Log in</a></p></div>{% endblock %}
